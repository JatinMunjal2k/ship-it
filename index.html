<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ship it — a game about software</title>
<style>
  :root {
    --bg:        #0c0c0e;
    --panel:     #141417;
    --panel-2:   #1b1b1f;
    --border:    #2a2a30;
    --text:      #e4e4e7;
    --dim:       #8a8a94;
    --dimmer:    #56565e;
    --accent:    #d97757;
    --good:      #6fcf7f;
    --bad:       #e5484d;
    --warn:      #e8b339;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  /* red flash on incident */
  body.incident::after {
    content: "";
    position: fixed; inset: 0;
    background: var(--bad);
    opacity: 0.14;
    pointer-events: none;
    animation: flash 0.5s ease-out forwards;
    z-index: 100;
  }
  @keyframes flash { to { opacity: 0; } }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: baseline; gap: 12px;
    padding-bottom: 14px; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: -0.2px; }
  h1 span { color: var(--accent); }
  .phase {
    margin-left: auto;
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--accent);
    border: 1px solid var(--accent);
    padding: 2px 8px; border-radius: 3px;
  }

  /* ---------- stats ---------- */
  .stats {
    display: grid; grid-template-columns: repeat(5, 1fr);
    gap: 1px; background: var(--border);
    border: 1px solid var(--border); border-radius: 6px;
    overflow: hidden; margin: 16px 0;
  }
  .stat { background: var(--panel); padding: 10px 12px; }
  .stat .label {
    font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
    color: var(--dimmer); margin-bottom: 2px;
  }
  .stat .value { font-size: 18px; font-weight: 600; letter-spacing: -0.5px; }
  .stat .sub { font-size: 11px; color: var(--dim); }
  .value.good { color: var(--good); }
  .value.bad  { color: var(--bad); }
  .value.warn { color: var(--warn); }

  /* ---------- layout ---------- */
  .cols { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  @media (max-width: 860px) { .cols { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .panel h2 {
    font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--dimmer); margin: 0;
    padding: 9px 12px; border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }

  /* ---------- prompt ---------- */
  .promptbox { padding: 14px; }
  .promptrow {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 5px; padding: 10px 12px;
    transition: border-color 0.15s;
  }
  .promptrow:focus-within { border-color: var(--accent); }
  .promptrow.cooling { opacity: 0.45; }
  .chev { color: var(--accent); font-weight: 700; }
  #prompt {
    flex: 1; background: none; border: none; outline: none;
    color: var(--text); font: inherit; font-size: 13px;
  }
  #prompt::placeholder { color: var(--dimmer); }
  .hint { font-size: 11px; color: var(--dimmer); margin-top: 8px; }
  .hint kbd {
    background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 3px; padding: 1px 5px; font: inherit; font-size: 10px;
    color: var(--dim);
  }

  .actions { display: flex; gap: 8px; margin-top: 10px; }
  .actions button {
    background: var(--panel-2); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px;
    padding: 7px 12px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .actions button:hover:not(:disabled) { background: #26262b; border-color: #3a3a42; }
  .actions button:disabled { opacity: 0.35; cursor: default; }

  /* ---------- log ---------- */
  #log {
    height: 300px; overflow-y: auto;
    padding: 10px 12px; font-size: 12px;
    display: flex; flex-direction: column-reverse;
  }
  #log div { padding: 2px 0; color: var(--dim); word-break: break-word; }
  #log .t { color: var(--dimmer); margin-right: 8px; font-size: 11px; }
  #log .ship     { color: var(--dim); }
  #log .incident { color: var(--bad); font-weight: 600; }
  #log .buy      { color: var(--accent); }
  #log .fix      { color: var(--good); }
  #log .note     { color: var(--warn); }

  /* ---------- upgrades ---------- */
  #upgrades { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .up {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 5px; padding: 10px;
    cursor: pointer; text-align: left; width: 100%;
    font: inherit; color: var(--text);
    transition: background 0.12s, border-color 0.12s, opacity 0.12s;
  }
  .up:hover:not(.locked) { border-color: #3a3a42; background: #232329; }
  .up.locked { opacity: 0.4; cursor: default; }
  .up .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .up .name { font-weight: 600; font-size: 12px; }
  .up .cost { color: var(--good); font-size: 12px; white-space: nowrap; }
  .up.locked .cost { color: var(--dimmer); }
  .up .desc { font-size: 11px; color: var(--dim); margin-top: 4px; }
  .up .owned {
    font-size: 10px; color: var(--accent); text-transform: uppercase;
    letter-spacing: 0.5px; margin-top: 4px;
  }
  .up .cost-warn { color: var(--bad); font-size: 11px; margin-top: 4px; }

  footer {
    margin-top: 16px; display: flex; justify-content: space-between;
    color: var(--dimmer); font-size: 11px;
  }
  footer button {
    background: none; border: none; color: var(--dimmer);
    font: inherit; font-size: 11px; cursor: pointer; text-decoration: underline;
  }
  footer button:hover { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>ship<span>_</span>it</h1>
    <span style="color:var(--dimmer);font-size:11px">an incremental game about software</span>
    <span class="phase" id="phase">Garage</span>
  </header>

  <div class="stats">
    <div class="stat">
      <div class="label">Users</div>
      <div class="value" id="s-users">0</div>
      <div class="sub" id="s-cap">cap 250</div>
    </div>
    <div class="stat">
      <div class="label">Cash</div>
      <div class="value good" id="s-cash">$0</div>
      <div class="sub" id="s-rate">$0.00/s</div>
    </div>
    <div class="stat">
      <div class="label">Features</div>
      <div class="value" id="s-features">0</div>
      <div class="sub" id="s-agents">no agents</div>
    </div>
    <div class="stat">
      <div class="label">Code Quality</div>
      <div class="value warn" id="s-quality">50%</div>
      <div class="sub">clean-ship rate</div>
    </div>
    <div class="stat">
      <div class="label">Open Bugs</div>
      <div class="value bad" id="s-bugs">??</div>
      <div class="sub" id="s-bugsub">no monitoring</div>
    </div>
  </div>

  <div class="cols">
    <div>
      <div class="panel">
        <h2>claude code</h2>
        <div class="promptbox">
          <div class="promptrow" id="promptrow">
            <span class="chev">&gt;</span>
            <input id="prompt" autocomplete="off" spellcheck="false" placeholder="add dark mode to the settings page">
          </div>
          <div class="hint">Type anything and press <kbd>Enter</kbd> to ship it. Or just mash <kbd>Enter</kbd>.</div>
          <div class="actions">
            <button id="fixbtn" style="display:none">Fix a bug</button>
          </div>
        </div>
      </div>

      <div class="panel" style="margin-top:16px">
        <h2>event log</h2>
        <div id="log"></div>
      </div>
    </div>

    <div class="panel">
      <h2>spend</h2>
      <div id="upgrades"></div>
    </div>
  </div>

  <footer>
    <span id="f-stats">0 incidents · 0 users lost</span>
    <button id="reset">reset</button>
  </footer>

</div>

<script>
"use strict";

/* ==========================================================================
   CONFIG — all balance lives here. Tweak these to change how the game feels.
   ========================================================================== */
const CONFIG = {
  USERS_PER_FEATURE:      12,     // new users each shipped feature attracts
  REVENUE_PER_USER:       0.015,  // $ per user per second
  BASE_QUALITY:           0.50,   // chance a shipped feature is bug-free
  BASE_USER_CAP:          250,    // servers you start with

  INCIDENT_CHANCE_PER_BUG: 0.004, // per bug, per second
  INCIDENT_MIN_LOSS:       0.06,  // fraction of users lost, low end
  INCIDENT_MAX_LOSS:       0.22,  // ...high end

  AGENT_INTERVAL:         6.0,    // seconds between each agent's auto-ship
  MANUAL_COOLDOWN:        0.0,    // seconds you must wait between ships
};

/* ==========================================================================
   STATE
   ========================================================================== */
function freshState() {
  return {
    users: 0,
    cash: 0,
    features: 0,
    bugs: 0,

    quality:        CONFIG.BASE_QUALITY,
    userCap:        CONFIG.BASE_USER_CAP,
    manualCooldown: CONFIG.MANUAL_COOLDOWN,
    agentInterval:  CONFIG.AGENT_INTERVAL,

    agents: 0,
    agentTimer: 0,
    cooldown: 0,
    monitoring: false,

    incidents: 0,
    usersLost: 0,
    elapsed: 0,
  };
}
let state = freshState();

/* ==========================================================================
   UPGRADES
   `unlock` decides when it becomes visible. `apply` mutates state.
   ========================================================================== */
function makeUpgrades() { return [
  {
    id: 'servers',
    name: 'Bigger servers',
    desc: '+400 user capacity.',
    cost: 60, scale: 1.7, repeatable: true, count: 0,
    unlock: () => state.features >= 3,
    apply: () => { state.userCap += 400; },
  },
  {
    id: 'tests',
    name: 'Unit tests',
    desc: 'Code quality 50% → 70%.',
    cost: 75, repeatable: false, count: 0,
    unlock: () => state.features >= 5,
    apply: () => { state.quality += 0.20; },
  },
  {
    id: 'agent',
    name: 'Background agent',
    desc: 'Ships a feature every 6s, forever. Never sleeps, never asks.',
    cost: 150, scale: 1.6, repeatable: true, count: 0,
    unlock: () => state.features >= 8,
    apply: () => { state.agents += 1; },
  },
  {
    id: 'monitoring',
    name: 'Monitoring',
    desc: 'See your actual bug count. Unlocks manual bug fixing.',
    cost: 400, repeatable: false, count: 0,
    unlock: () => state.incidents >= 1,
    apply: () => { state.monitoring = true; },
  },
  {
    id: 'review',
    name: 'Code review',
    desc: 'Quality +15%. But every ship now waits 0.6s in review.',
    warn: 'Slows you down. On purpose.',
    cost: 900, repeatable: false, count: 0,
    unlock: () => state.features >= 30,
    apply: () => {
      state.quality += 0.15;
      state.manualCooldown += 0.6;
      state.agentInterval *= 1.35;
    },
  },
  {
    id: 'ci',
    name: 'CI/CD pipeline',
    desc: 'Quality +10%. Agents ship 20% faster once the pipeline is green.',
    cost: 2500, repeatable: false, count: 0,
    unlock: () => state.cash >= 900 && state.features >= 50,
    apply: () => {
      state.quality += 0.10;
      state.agentInterval *= 0.8;
    },
  },
  {
    id: 'oncall',
    name: 'On-call rotation',
    desc: 'Incidents cost half as many users. Someone is always awake.',
    cost: 6000, repeatable: false, count: 0,
    unlock: () => state.incidents >= 5 && state.features >= 80,
    apply: () => { state.incidentMitigation = 0.5; },
  },
]; }
let upgrades = makeUpgrades();

/* ==========================================================================
   FLAVOR
   ========================================================================== */
const FEATURES = [
  "Added dark mode", "Refactored the auth service", "Bumped 41 dependencies",
  "Fixed the fix for the fix", "Migrated to a new state library",
  "Added a settings page nobody asked for", "Rewrote it in Rust (partially)",
  "Deleted 4,000 lines of dead code", "Added telemetry", "Removed telemetry",
  "Split the monolith", "Merged the microservices back",
  "Introduced a feature flag", "Removed the feature flag",
  "Made the button 2px rounder", "Added infinite scroll",
  "Cached everything", "Invalidated the cache",
  "Added an onboarding flow", "Shipped straight to prod on a Friday",
  "Renamed `data` to `payload`", "Added a loading spinner",
  "Upgraded the design system", "Wrote a migration script",
  "Added keyboard shortcuts", "Localized into three languages",
];

const BUGS = [
  "Race condition in the payment flow", "Memory leak in the websocket handler",
  "Off-by-one in pagination", "Unhandled null in the user profile",
  "Infinite retry loop hammering the API", "Timezone bug (always the timezone)",
  "N+1 query taking down the database", "Regex catastrophically backtracking",
  "Stale cache serving deleted accounts", "Migration ran twice",
  "Rate limiter rate-limiting itself", "Feature flag defaulted to on for everyone",
  "Auth token never expiring", "Uncaught promise rejection in checkout",
];

const pick = a => a[Math.floor(Math.random() * a.length)];

/* ==========================================================================
   HELPERS
   ========================================================================== */
function fmt(n) {
  n = Math.floor(n);
  if (n >= 1e9) return (n / 1e9).toFixed(2) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
function money(n) {
  if (n >= 1e6) return '$' + (n / 1e6).toFixed(2) + 'M';
  if (n >= 1e3) return '$' + (n / 1e3).toFixed(1) + 'K';
  return '$' + n.toFixed(0);
}
function costOf(u) {
  return u.repeatable ? Math.floor(u.cost * Math.pow(u.scale, u.count)) : u.cost;
}

const logEl = document.getElementById('log');
function log(msg, cls) {
  const d = document.createElement('div');
  const mm = String(Math.floor(state.elapsed / 60)).padStart(2, '0');
  const ss = String(Math.floor(state.elapsed % 60)).padStart(2, '0');
  d.className = cls || '';
  d.innerHTML = '<span class="t">' + mm + ':' + ss + '</span>' + msg;
  logEl.prepend(d);
  while (logEl.children.length > 60) logEl.lastChild.remove();
}

/* ==========================================================================
   ACTIONS
   ========================================================================== */
function shipFeature(manual) {
  if (manual && state.cooldown > 0) return;
  if (manual) state.cooldown = state.manualCooldown;

  state.features++;

  const room = Math.max(0, state.userCap - state.users);
  const gained = Math.min(CONFIG.USERS_PER_FEATURE, room);
  state.users += gained;

  const clean = Math.random() < state.quality;
  if (!clean) state.bugs++;

  if (manual) {
    let msg = pick(FEATURES) + ' <span style="color:var(--dimmer)">·</span> ';
    msg += gained > 0
      ? '<span style="color:var(--good)">+' + gained + ' users</span>'
      : '<span style="color:var(--warn)">at capacity — no new users</span>';
    log(msg, 'ship');
  }
}

function fixBug() {
  if (state.cooldown > 0 || state.bugs <= 0) return;
  state.cooldown = Math.max(0.3, state.manualCooldown);
  state.bugs--;
  log('Fixed: ' + pick(BUGS) + '.', 'fix');
}

function triggerIncident() {
  state.incidents++;
  state.bugs = Math.max(0, state.bugs - 1);

  const mit  = state.incidentMitigation || 1;
  const span = CONFIG.INCIDENT_MAX_LOSS - CONFIG.INCIDENT_MIN_LOSS;
  const frac = (CONFIG.INCIDENT_MIN_LOSS + Math.random() * span) * mit;
  const lost = Math.min(state.users, Math.ceil(state.users * frac));

  state.users -= lost;
  state.usersLost += lost;

  log('INCIDENT — ' + pick(BUGS) + '. <span style="color:var(--bad)">−' +
      fmt(lost) + ' users</span>', 'incident');

  document.body.classList.remove('incident');
  void document.body.offsetWidth;          // restart the CSS animation
  document.body.classList.add('incident');

  if (state.incidents === 1) {
    log('Users churn when things break. Bugs you cannot see still count.', 'note');
  }
}

function buy(u) {
  const c = costOf(u);
  if (state.cash < c) return;
  if (!u.repeatable && u.count > 0) return;

  state.cash -= c;
  u.count++;
  u.apply();
  log('Bought <b>' + u.name + '</b> for ' + money(c) + '.', 'buy');
  renderUpgrades();
}

/* ==========================================================================
   GAME LOOP
   ========================================================================== */
function tick(dt) {
  state.elapsed += dt;

  // revenue
  state.cash += state.users * CONFIG.REVENUE_PER_USER * dt;

  // cooldown
  if (state.cooldown > 0) state.cooldown = Math.max(0, state.cooldown - dt);

  // agents ship on their own
  if (state.agents > 0) {
    state.agentTimer += dt * state.agents;
    while (state.agentTimer >= state.agentInterval) {
      state.agentTimer -= state.agentInterval;
      shipFeature(false);
    }
  }

  // incidents — each bug independently rolls every second
  if (state.bugs > 0 && state.users > 0) {
    const p = 1 - Math.pow(1 - CONFIG.INCIDENT_CHANCE_PER_BUG, state.bugs * dt);
    if (Math.random() < p) triggerIncident();
  }
}

/* ==========================================================================
   RENDER
   ========================================================================== */
const $ = id => document.getElementById(id);

function phaseName() {
  if (state.users < 100)   return 'Garage';
  if (state.users < 1000)  return 'Traction';
  if (state.users < 10000) return 'Scale';
  return 'Enterprise';
}

function render() {
  $('s-users').textContent    = fmt(state.users);
  $('s-cap').textContent      = 'cap ' + fmt(state.userCap) +
                                (state.users >= state.userCap ? ' — FULL' : '');
  $('s-cash').textContent     = money(state.cash);
  $('s-rate').textContent     = '$' + (state.users * CONFIG.REVENUE_PER_USER).toFixed(2) + '/s';
  $('s-features').textContent = fmt(state.features);
  $('s-agents').textContent   = state.agents === 0 ? 'no agents'
                              : state.agents + (state.agents === 1 ? ' agent' : ' agents');
  $('s-quality').textContent  = Math.round(state.quality * 100) + '%';
  $('s-bugs').textContent     = state.monitoring ? fmt(state.bugs) : '??';
  $('s-bugsub').textContent   = state.monitoring ? 'visible' : 'no monitoring';
  $('phase').textContent      = phaseName();
  $('f-stats').textContent    = state.incidents + ' incident' + (state.incidents === 1 ? '' : 's') +
                                ' · ' + fmt(state.usersLost) + ' users lost';

  $('promptrow').classList.toggle('cooling', state.cooldown > 0);

  const fb = $('fixbtn');
  fb.style.display = state.monitoring ? '' : 'none';
  fb.disabled = state.bugs <= 0 || state.cooldown > 0;
  fb.textContent = state.bugs > 0 ? 'Fix a bug (' + fmt(state.bugs) + ' open)' : 'No known bugs';

  // upgrade affordability
  for (const u of upgrades) {
    const el = document.getElementById('up-' + u.id);
    if (!el) continue;
    const c = costOf(u);
    el.classList.toggle('locked', state.cash < c);
    el.querySelector('.cost').textContent = money(c);
  }
}

function renderUpgrades() {
  const box = $('upgrades');
  box.innerHTML = '';
  let shown = 0;

  for (const u of upgrades) {
    if (!u.repeatable && u.count > 0) {
      const done = document.createElement('div');
      done.className = 'up';
      done.style.cssText = 'opacity:.55;cursor:default';
      done.innerHTML = '<div class="top"><span class="name">' + u.name +
                       '</span><span style="color:var(--good);font-size:11px">owned</span></div>';
      box.appendChild(done);
      shown++;
      continue;
    }
    if (!u.unlock()) continue;

    const b = document.createElement('button');
    b.className = 'up';
    b.id = 'up-' + u.id;
    b.innerHTML =
      '<div class="top"><span class="name">' + u.name + '</span>' +
      '<span class="cost">' + money(costOf(u)) + '</span></div>' +
      '<div class="desc">' + u.desc + '</div>' +
      (u.warn ? '<div class="cost-warn">' + u.warn + '</div>' : '') +
      (u.repeatable && u.count > 0 ? '<div class="owned">owned ×' + u.count + '</div>' : '');
    b.onclick = () => buy(u);
    box.appendChild(b);
    shown++;
  }

  if (shown === 0) {
    box.innerHTML = '<div style="padding:14px;color:var(--dimmer);font-size:11px">' +
                    'Ship a few features first.</div>';
  }
}

/* ==========================================================================
   INPUT + BOOT
   ========================================================================== */
const promptEl = $('prompt');

promptEl.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();
  shipFeature(true);
  promptEl.value = '';
});

$('fixbtn').onclick = () => { fixBug(); promptEl.focus(); };

$('reset').onclick = () => {
  if (!confirm('Reset the game?')) return;
  state = freshState();
  upgrades = makeUpgrades();
  logEl.innerHTML = '';
  renderUpgrades();
  log('Fresh repo. Good luck.', 'note');
};

// unlock checks are cheap; re-render the shop when the visible set changes
let lastKey = '';
function unlockWatch() {
  const key = upgrades.map(u => (u.unlock() ? 1 : 0) + ':' + u.count).join(',');
  if (key !== lastKey) { lastKey = key; renderUpgrades(); }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.25, (now - last) / 1000);   // clamp for tab-switches
  last = now;
  tick(dt);
  unlockWatch();
  render();
  requestAnimationFrame(frame);
}

renderUpgrades();
render();
log('You have an app. It has no users. Ship something.', 'note');
promptEl.focus();
requestAnimationFrame(frame);
</script>
</body>
</html>
